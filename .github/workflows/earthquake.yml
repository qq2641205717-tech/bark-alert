name: 地震与津波监控
on:
  workflow_dispatch:
  # 定时兜底: GitHub schedule 最少 5 分钟, 不能替代每分钟的外部 dispatch,
  # 只在外部调用方停了时保证每 5 分钟至少跑一次, 不至于静默停摆
  schedule:
    - cron: '*/5 * * * *'

# 同一个 workflow 的多次运行排队不取消, 避免自己跟自己抢写 eq_state.json。
# 不同 workflow 之间不再抢同一个文件: 地震只写 eq_state.json,
# 天气只写 wx_state.json, watchdog 只写 wd_state.json (见 alert.py 状态分流),
# 所以跨 workflow 并发回写时 rebase 不再冲突。
concurrency:
  group: earthquake-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查地震/津波
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          STATE_FILE: eq_state.json
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3; do
            if python alert.py earthquake; then ok=1; break; fi
            echo "attempt $i failed, retrying in 20s..."
            sleep 20
          done
          if [ "$ok" -ne 1 ]; then
            echo "ERROR: alert.py earthquake failed 3 times, failing the run on purpose"
            exit 1
          fi
      - name: 回写状态
        # 回写失败必须让这一步变红, 绝不能吞掉 (见 weather.yml 注释,
        # 2026-11-10 晚报刷屏的教训)。只写 eq_state.json 一个文件;
        # rebase 用 fetch + rebase origin/main, 3 次都推不上去就 exit 1。
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eq_state.json
          if git diff --staged --quiet; then
            echo "no state change, nothing to push"
            exit 0
          fi
          git commit -m "chore(eq): state $(date -u +%FT%TZ)"
          pushed=0
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "write-back attempt $i failed, aborting rebase and retrying..."
            if git rebase --abort; then echo "rebase aborted"; fi
            sleep 2
          done
          if [ "$pushed" -ne 1 ]; then
            echo "ERROR: eq_state.json write-back failed after 3 attempts"
            exit 1
          fi

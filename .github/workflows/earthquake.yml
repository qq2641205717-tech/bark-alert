name: 地震与津波监控
on:
  workflow_dispatch:
  # 定时兜底: GitHub schedule 最少 5 分钟, 不能替代每分钟的外部 dispatch,
  # 只在外部调用方停了时保证每 5 分钟至少跑一次, 不至于静默停摆
  schedule:
    - cron: '*/5 * * * *'

# 同一个 workflow 的多次运行排队不取消, 避免自己跟自己抢写 eq_state.json。
# 不同 workflow 之间不再抢同一个文件: 地震只写 eq_state.json,
# 天气只写 wx_state.json, watchdog 只写 wd_state.json (见 alert.py 状态分流)。
# 但重叠运行仍会让 rebase 冲突 (2026-11-12 凌晨 05:52–06:53 地震连着失败,
# 日志就是 rebase 冲突), 所以回写改成跟天气 / watchdog 一样的 reset+重放,
# 不用 rebase。
concurrency:
  group: earthquake-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查地震/津波
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          STATE_FILE: eq_state.json
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3; do
            if python alert.py earthquake; then ok=1; break; fi
            echo "attempt $i failed, retrying in 20s..."
            sleep 20
          done
          if [ "$ok" -ne 1 ]; then
            echo "ERROR: alert.py earthquake failed 3 times, failing the run on purpose"
            exit 1
          fi
      - name: 回写状态
        # 回写失败必须让这一步变红, 绝不能吞掉 (见 weather.yml 注释,
        # 2026-11-10 晚报刷屏的教训)。只写 eq_state.json 一个文件;
        # 不用 rebase: 2026-11-12 凌晨 05:52–06:53 地震连续失败,
        # 日志就是 rebase 冲突 (CONFLICT in eq_state.json), concurrency
        # 分组没防住重叠运行 (状态文件每次整文件重写, 心跳那几行每次都改,
        # 只要另一趟运行在本趟 checkout 之后 push 过, rebase 就一定冲突)。
        # 改成跟 weather.yml / watchdog.yml 一样的办法: fetch 后 reset
        # --hard 到最新 main, 再把本次算好的状态重新放回去提交推送:
        # 状态是每次整份重算的, 日期标记幂等、心跳只会更新, 覆盖写
        # 是安全的; 3 次都推不上去就 exit 1, 宁可让运行变红, 也不
        # 让它假装成功。
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- eq_state.json; then
            echo "no state change, nothing to push"
            exit 0
          fi
          # 先把本次算好的状态存到 /tmp, 下面的 reset 会清掉工作区
          cp eq_state.json /tmp/eq_state.new.json
          pushed=0
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/eq_state.new.json eq_state.json
            git add eq_state.json
            if git diff --staged --quiet; then
              echo "state already up to date on main, nothing to push"
              pushed=1
              break
            fi
            git commit -m "chore(eq): state $(date -u +%FT%TZ)"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "write-back attempt $i failed, retrying..."
            sleep 2
          done
          if [ "$pushed" -ne 1 ]; then
            echo "ERROR: eq_state.json write-back failed after 3 attempts"
            exit 1
          fi

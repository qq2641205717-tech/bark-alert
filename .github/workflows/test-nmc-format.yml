name: 测试新版预警通知（临时）
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 发送一条新版道路冰雪预警测试通知
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          python -c "
          import alert
          alert.bark('⚠️【通化梅河口】道路冰雪蓝色预警',
                     '11-16 16:58发布',
                     '梅河口、柳河、通化县、通化市、辉南、集安',
                     '道路可能结冰积雪，影响交通',
                     '路面湿滑，减速慢行',
                     '共6站，新预警',
                     icon='road_snow', level='timeSensitive', group='alert',
                     url='http://www.nmc.cn/publish/alarm.html')
          print('测试通知已发送')
          "

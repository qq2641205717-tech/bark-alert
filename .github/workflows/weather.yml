name: 天气监控与预报
on:
  workflow_dispatch:
  # 定时兜底: GitHub schedule 最少 5 分钟, 不能替代每分钟的外部 dispatch,
  # 只在外部调用方停了时保证每 5 分钟至少跑一次, 不至于静默停摆
  schedule:
    - cron: '*/5 * * * *'

# 同一个 workflow 的多次运行排队不取消, 避免自己跟自己抢写 wx_state.json。
# 不同 workflow 之间不再抢同一个文件: 天气只写 wx_state.json,
# 地震只写 eq_state.json, watchdog 只写 wd_state.json (见 alert.py 状态分流),
# 所以跨 workflow 并发回写时 rebase 不再冲突。
concurrency:
  group: weather-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 同步最新状态
      # checkout 拿到的是 dispatch 时的 main, 排队等前一趟跑完再启动时状态已经旧了,
      # alert.py 会拿旧状态做去重判断, 同一条预警重复推
      # (2026-11-14 07:23 大雾黄 07:32 推了两次)。先 fetch + reset 到最新 main 再跑。
      run: |
        git fetch origin main
        git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 运行天气监控
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          STATE_FILE: wx_state.json
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3; do
            if python alert.py weather; then ok=1; break; fi
            echo "attempt $i failed, retrying in 20s..."
            sleep 20
          done
          if [ "$ok" -ne 1 ]; then
            echo "ERROR: alert.py weather failed 3 times, failing the run on purpose"
            exit 1
          fi
      - name: 回写状态
        # 回写失败必须让这一步变红, 绝不能再把失败吞掉:
        # 2026-11-10 晚报刷屏就是因为回写步骤表面绿色、实际 push 失败,
        # last_evening 推不回去, 下一分钟又以为没发过。
        # 只写 wx_state.json 一个文件; 不用 rebase: 每分钟跑一次,
        # 只要另一趟运行在本趟 checkout 之后 push 过, rebase 就一定
        # 冲突 (状态文件每次整文件重写, 心跳那几行每次都改),
        # 2026-11-11 09:28 / 10:03 两次失败就是这么来的 (job 排队
        # 晚启动, checkout 的 base 已经旧了)。改成 fetch 后 reset
        # --hard 到最新 main, 再把本次算好的状态重新放回去提交推送:
        # 状态是每次整份重算的, 日期标记幂等、心跳只会更新, 覆盖写
        # 是安全的; 3 次都推不上去就 exit 1, 宁可让运行变红, 也不
        # 让它假装成功。
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- wx_state.json; then
            echo "no state change, nothing to push"
            exit 0
          fi
          # 先把本次算好的状态存到 /tmp, 下面的 reset 会清掉工作区
          cp wx_state.json /tmp/wx_state.new.json
          pushed=0
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/wx_state.new.json wx_state.json
            git add wx_state.json
            if git diff --staged --quiet; then
              echo "state already up to date on main, nothing to push"
              pushed=1
              break
            fi
            git commit -m "chore(wx): state $(date -u +%FT%TZ)"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "write-back attempt $i failed, retrying..."
            sleep 2
          done
          if [ "$pushed" -ne 1 ]; then
            echo "ERROR: wx_state.json write-back failed after 3 attempts; last_evening/last_morning may not be persisted and the next run may resend"
            exit 1
          fi

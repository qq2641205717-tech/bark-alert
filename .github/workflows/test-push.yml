name: 模拟推送测试（临时）
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 模拟一次非紧急推送
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          python -c "
          import alert
          alert.bark('通化 🌡️测试 +5.0°C', '现在 -1° 体感 -5° 晴', '上次 -6° 风 2级 湿度 40%', 'AQI 70 PM2.5 30 注意增减衣物', level='timeSensitive')
          alert.bark('梧州 今日天气（测试）', '白天晴 体感 18°', '夜间 12° 降水 10% 风 1级', 'AQI 63 PM2.5 25 湿度 60%', level='timeSensitive')
          print('模拟推送完成')
          "
